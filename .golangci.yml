version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # Temporary: these reconcilers are long by design for now. Drop each entry
      # once its function is split up.
      - linters:
          - gocyclo
        path: internal/controller/rolloutstepgate_controller\.go
        text: "of func `\\(\\*RolloutStepGateReconciler\\)\\.Reconcile` is high"
      - linters:
          - gocyclo
        path: internal/controller/rollouttest_controller\.go
        text: "of func `\\(\\*RolloutTestReconciler\\)\\.Reconcile` is high"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
